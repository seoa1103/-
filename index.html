<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="서로 독립된 시리즈를 하이퍼링크로 탐색하는 미니멀 아카이브"
    />
    <title>HYPERLINK ARCHIVE</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">본문으로 건너뛰기</a>

    <header class="site-header">
      <a class="wordmark" href="#/room/entrance" aria-label="첫 시리즈 시작 화면">
        HYPERLINK<br />ARCHIVE
      </a>
      <p class="site-note">NON-LINEAR SERIES / INDEPENDENT PATHS</p>
    </header>

    <nav class="series-tabs" aria-label="시리즈 선택">
      <div id="series-tabs" class="series-tabs__inner" role="tablist"></div>
    </nav>

    <main id="reader" class="reader-shell" tabindex="-1">
      <aside class="series-index" aria-label="현재 시리즈 정보">
        <p id="series-number" class="eyebrow"></p>
        <h1 id="series-title"></h1>
        <p id="series-description" class="series-description"></p>

        <dl class="series-stats">
          <div>
            <dt>현재 조각</dt>
            <dd id="current-count">—</dd>
          </div>
          <div>
            <dt>방문 기록</dt>
            <dd id="visited-count">—</dd>
          </div>
        </dl>

        <div class="series-actions">
          <button id="previous-button" class="text-button" type="button">이전 조각</button>
          <button id="reset-button" class="text-button" type="button">이 시리즈 처음으로</button>
        </div>
      </aside>

      <article class="fragment" aria-live="polite">
        <header class="fragment-header">
          <p id="fragment-kicker" class="eyebrow"></p>
          <button id="copy-link-button" class="copy-button" type="button">링크 복사</button>
        </header>

        <h2 id="fragment-title"></h2>
        <div id="fragment-body" class="fragment-body"></div>

        <nav class="link-field" aria-label="다음 조각 선택">
          <p class="link-field__label">SELECT A LINK</p>
          <div id="fragment-links" class="fragment-links"></div>
        </nav>
      </article>
    </main>

    <footer class="site-footer">
      <p>각 시리즈의 경로와 방문 기록은 서로 공유되지 않습니다.</p>
      <p>© HYPERLINK ARCHIVE</p>
    </footer>

    <noscript>이 사이트의 하이퍼링크 탐색에는 JavaScript가 필요합니다.</noscript>
    <script type="module" src="./app.js"></script>
  </body>
</html>
